<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>接诊列表 · 工牌接诊分析系统</title>
<link rel="stylesheet" href="{{ url_for('static', filename='report.css') }}">
<style>
html,body{overflow-x:hidden;max-width:100%}
.list-wrap{max-width:1280px;margin:0 auto;padding:30px 40px 80px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.toolbar input{border:1px solid var(--border);border-radius:4px;padding:8px 12px;font-family:inherit;font-size:13px;outline:none}
.toolbar input:focus{border-color:var(--blue)}
.toolbar button{background:var(--navy);color:#fff;border:none;border-radius:4px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit}
.toolbar button.sec{background:#fff;color:var(--navy);border:1px solid var(--border)}
.toolbar button:hover{opacity:.9}
.sess-tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;border:1px solid var(--border)}
.sess-tbl th{background:var(--navy);color:#fff;text-align:left;padding:11px 14px;font-size:12px;font-weight:600;letter-spacing:.05em}
.sess-tbl td{padding:13px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.sess-tbl tr:hover td{background:var(--bg-light)}
.sess-tbl tr:last-child td{border-bottom:none}
.status-tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:600}
.s-done{background:rgba(39,174,96,.12);color:var(--green)}
.s-running{background:rgba(74,144,217,.12);color:var(--blue)}
.s-running::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);margin-right:5px;vertical-align:middle;animation:blink 1.2s infinite}
.s-pending{background:rgba(230,126,34,.12);color:var(--orange)}
.s-idle{background:rgba(138,149,163,.12);color:var(--text-mute)}
.s-failed{background:rgba(231,76,60,.12);color:var(--red)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.score-cell{font-size:18px;font-weight:700;color:var(--navy)}
.score-cell.warn{color:var(--orange)}
.score-cell.bad{color:var(--red)}
.score-cell.good{color:var(--green)}
.empty{text-align:center;padding:60px;color:var(--text-mute)}
.pagi{margin-top:16px;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text-mid)}
.pagi button{background:#fff;color:var(--navy);border:1px solid var(--border);border-radius:4px;padding:5px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.pagi button:disabled{opacity:.4;cursor:not-allowed}
.header-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.header-title{font-size:20px;font-weight:700;color:var(--navy)}
.header-user{font-size:13px;color:var(--text-mute)}

/* ─── 手机端 ─── */
@media (max-width: 768px){
  .list-wrap{padding:14px 12px 60px;max-width:100%;width:100%;overflow-x:hidden}
  .header-bar,.toolbar,.sess-tbl,.pagi{max-width:100%}
  *{min-width:0}
  .header-title{font-size:17px}
  .header-user{font-size:12px}
  .toolbar{gap:8px}
  .toolbar input{flex:1;min-width:0;width:100%;font-size:16px;padding:8px 10px}
  .toolbar input[type=date]{flex:1 1 140px}
  .toolbar #qAdvisor,.toolbar #qCustomer{flex:1 1 calc(50% - 4px)}
  .toolbar button{padding:8px 12px;font-size:13px}
  .toolbar > div[style*="flex:1"]{display:none}

  /* 表格→卡片布局 */
  .sess-tbl,.sess-tbl tbody,.sess-tbl tr,.sess-tbl td{display:block;width:100%}
  .sess-tbl thead{display:none}
  .sess-tbl{border:none;background:transparent}
  .sess-tbl tr{background:#fff;border:1px solid var(--border);border-radius:6px;margin-bottom:10px;padding:12px 14px}
  .sess-tbl tr:hover td{background:transparent}
  .sess-tbl td{border:none;padding:4px 0;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .sess-tbl td::before{content:attr(data-label);color:var(--text-mute);font-size:12px;flex-shrink:0}
  .sess-tbl td:last-child{margin-top:8px;padding-top:10px;border-top:1px dashed var(--border);justify-content:center}
  .sess-tbl td:last-child::before{display:none}
  .sess-tbl td:last-child a{display:block;width:100%;text-align:center;background:var(--navy);color:#fff !important;padding:10px;border-radius:4px;font-size:14px}
  .pagi{flex-wrap:wrap;font-size:12px}
  #uploadMsg{width:100%;margin-left:0 !important}
}
</style>
</head>
<body>
<div class="list-wrap">
  <div class="header-bar">
    <div class="header-title">工牌接诊分析系统</div>
    <div class="header-user">
      {{ username or '' }}（{{ role or '' }}）
      {% if role in ('admin', 'super') %} · <a href="{{ url_for('admin_page') }}" style="color:var(--blue)">管理后台</a>{% endif %}
      {% if role == 'consultant' %} · <a href="{{ url_for('consultant_page') }}" style="color:var(--blue)">返回录音页</a>{% endif %}
       · <a href="{{ url_for('logout') }}" style="color:var(--blue)">退出</a>
    </div>
  </div>

  <div class="toolbar">
    <input id="qAdvisor" placeholder="顾问">
    <input id="qCustomer" placeholder="顾客">
    <input id="qDate" type="date">
    <button onclick="loadList(1)">筛选</button>
    <button class="sec" onclick="resetFilter()">重置</button>
    <div style="flex:1"></div>
    <button class="sec" onclick="scanOss()">扫描 OSS</button>
    <button onclick="document.getElementById('uploadInput').click()">上传录音</button>
    <input id="uploadInput" type="file" multiple accept="audio/*" style="display:none" onchange="uploadFiles()">
  </div>

  <table class="sess-tbl">
    <thead>
      <tr>
        <th style="width:110px">服务日期</th>
        <th style="width:100px">顾问</th>
        <th style="width:120px">顾客</th>
        <th style="width:90px">录音/ASR</th>
        <th style="width:100px">综合分</th>
        <th style="width:90px">分析状态</th>
        <th style="width:60px">点评</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="listBody">
      <tr><td colspan="8" class="empty">加载中…</td></tr>
    </tbody>
  </table>

  <div class="pagi">
    <button id="prevBtn" onclick="changePage(-1)">‹ 上一页</button>
    <span id="pageInfo"></span>
    <button id="nextBtn" onclick="changePage(1)">下一页 ›</button>
    <span id="uploadMsg" style="margin-left:auto;color:var(--text-mute)"></span>
  </div>
</div>

<script>
const BASE = {{ request.script_root|tojson }};
const ROLE = {{ role|tojson }};
let curPage = 1;
let totalPages = 1;
const PAGE_SIZE = 20;

function fmtScore(s) {
  if (s == null) return '<span style="color:var(--text-mute)">—</span>';
  const cls = s >= 7 ? 'good' : (s >= 5 ? 'warn' : 'bad');
  return `<span class="score-cell ${cls}">${(+s).toFixed(1)}</span>`;
}

function fmtStatus(s, progress) {
  const map = {
    idle:    ['未分析',  's-idle'],
    queued:  ['排队中',  's-pending'],
    running: ['分析中',  's-running'],
    done:    ['已完成',  's-done'],
    failed:  ['失败',    's-failed'],
  };
  const [t, c] = map[s] || [s || '—', 's-idle'];
  const tip = progress ? ` title="${progress.replace(/"/g,'&quot;')}"` : '';
  return `<span class="status-tag ${c}"${tip}>${t}</span>`;
}

function loadList(page) {
  curPage = page;
  const adv = document.getElementById('qAdvisor').value.trim();
  const cus = document.getElementById('qCustomer').value.trim();
  const date = document.getElementById('qDate').value;
  const params = new URLSearchParams({page: page, page_size: PAGE_SIZE});
  if (adv) params.set('advisor', adv);
  if (cus) params.set('customer', cus);
  if (date) params.set('date', date);
  fetch(BASE + '/api/sessions?' + params).then(r => r.json()).then(data => {
    const tbody = document.getElementById('listBody');
    if (!data.sessions || !data.sessions.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="empty">没有匹配的接诊</td></tr>';
    } else {
      tbody.innerHTML = data.sessions.map(s => {
        let overall = null;
        try { overall = s.analysis_scores ? JSON.parse(s.analysis_scores).overall : null; } catch(e){}
        return `<tr>
          <td data-label="服务日期">${s.service_date || '—'}</td>
          <td data-label="顾问">${s.advisor || '—'}</td>
          <td data-label="顾客">${s.customer || '—'}</td>
          <td data-label="录音/ASR">${s.asr_done_count || 0}/${s.recording_count || 0}</td>
          <td data-label="综合分">${fmtScore(overall)}</td>
          <td data-label="分析状态">${fmtStatus(s.display_status, s.analysis_progress)}</td>
          <td data-label="点评">${s.has_evaluation ? '✓' : '—'}</td>
          <td style="white-space:nowrap">
            <a href="${BASE}/session/${s.id}" style="color:var(--blue);font-weight:600">查看 →</a>
            ${ROLE === 'admin' || ROLE === 'super' ? `
              ${s.recording_count > 0 ? `<button onclick="deleteSessionRecs(${s.id},this)" style="margin-left:6px;background:none;border:1px solid rgba(231,76,60,.5);color:#e74c3c;border-radius:3px;padding:2px 7px;font-size:12px;cursor:pointer" title="删除录音文件">🗑录音</button>` : ''}
              ${s.display_status === 'done' ? `<button onclick="deleteSessionReport(${s.id},this)" style="margin-left:4px;background:none;border:1px solid rgba(230,126,34,.5);color:#e67e22;border-radius:3px;padding:2px 7px;font-size:12px;cursor:pointer" title="清除分析报告">🗑报告</button>` : ''}
              <button onclick="deleteSessionFull(${s.id},this)" style="margin-left:4px;background:none;border:1px solid rgba(231,76,60,.5);color:#e74c3c;border-radius:3px;padding:2px 7px;font-size:12px;cursor:pointer;font-weight:600" title="完全删除此接诊">⚠全删</button>
            ` : ''}
            ${s.recording_count > 0 && ROLE === 'consultant' ? `<button onclick="requestDelSessionRecs(${s.id},this)" style="margin-left:8px;background:none;border:1px solid #ccc;color:#555;border-radius:3px;padding:2px 8px;font-size:12px;cursor:pointer">申请删除</button>` : ''}
          </td>
        </tr>`;
      }).join('');
    }
    totalPages = Math.max(1, Math.ceil(data.total / data.page_size));
    document.getElementById('pageInfo').textContent = `第 ${data.page} / ${totalPages} 页（共 ${data.total} 条）`;
    document.getElementById('prevBtn').disabled = data.page <= 1;
    document.getElementById('nextBtn').disabled = data.page >= totalPages;
  });
}

function changePage(delta) {
  const next = curPage + delta;
  if (next < 1 || next > totalPages) return;
  loadList(next);
}

function resetFilter() {
  document.getElementById('qAdvisor').value = '';
  document.getElementById('qCustomer').value = '';
  document.getElementById('qDate').value = '';
  loadList(1);
}

function scanOss() {
  const msg = document.getElementById('uploadMsg');
  msg.textContent = '正在扫描 OSS…';
  fetch(BASE + '/api/scan', {method: 'POST'}).then(r => r.json()).then(d => {
    msg.textContent = `扫描完成，新增 ${d.added} 个录音。`;
    loadList(curPage);
    setTimeout(() => msg.textContent = '', 4000);
  });
}

function uploadFiles() {
  const inp = document.getElementById('uploadInput');
  if (!inp.files.length) return;
  const fd = new FormData();
  for (const f of inp.files) fd.append('files', f);
  const msg = document.getElementById('uploadMsg');
  msg.textContent = `上传中…(${inp.files.length} 个文件)`;
  fetch(BASE + '/api/upload', {method: 'POST', body: fd}).then(r => r.json()).then(d => {
    msg.textContent = `已上传 ${(d.created || []).length} 个文件，正在自动 ASR + 分析…`;
    inp.value = '';
    loadList(1);
    setTimeout(() => msg.textContent = '', 6000);
  }).catch(e => { msg.textContent = '上传失败：' + e; });
}

async function deleteSessionRecs(sid, btn) {
  if (!confirm('确认删除该接诊的全部录音文件？不可恢复！')) return;
  btn.disabled = true;
  const r = await fetch(BASE + '/api/session/' + sid + '/recordings/delete', {method: 'DELETE'});
  const d = await r.json();
  if (d.ok) { btn.textContent = '已删除'; btn.style.opacity = '0.4'; loadList(curPage); }
  else { alert(d.error || '删除失败'); btn.disabled = false; }
}

async function deleteSessionReport(sid, btn) {
  if (!confirm('确认清除该接诊的分析报告？录音和接诊记录保留。')) return;
  btn.disabled = true;
  const r = await fetch(BASE + '/api/session/' + sid + '/report/delete', {method: 'DELETE'});
  const d = await r.json();
  if (d.ok) { btn.textContent = '已清除'; btn.style.opacity = '0.4'; loadList(curPage); }
  else { alert(d.error || '失败'); btn.disabled = false; }
}

async function deleteSessionFull(sid, btn) {
  if (!confirm('⚠ 完全删除此接诊？录音文件、分析报告、接诊记录将全部删除，不可恢复！')) return;
  btn.disabled = true;
  const r = await fetch(BASE + '/api/session/' + sid + '/delete', {method: 'DELETE'});
  const d = await r.json();
  if (d.ok) { loadList(curPage); }
  else { alert(d.error || '失败'); btn.disabled = false; }
}

async function requestDelSessionRecs(sid, btn) {
  const reason = prompt('申请删除原因（可选）：');
  if (reason === null) return;
  btn.disabled = true;
  const r = await fetch(BASE + '/api/session/' + sid + '/delete-request', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({reason}),
  });
  const d = await r.json();
  if (d.ok) { btn.textContent = '已申请'; btn.style.opacity = '0.5'; }
  else { alert(d.error || '申请失败'); btn.disabled = false; }
}

loadList(1);
setInterval(() => loadList(curPage), 30000);  // 30s 自动刷新
</script>
</body>
</html>
