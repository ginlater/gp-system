{% extends "base.html" %}
{% block title %}录音详情 · 工牌接诊分析系统{% endblock %}
{% block body %}
<header class="topbar">
  <div class="topbar-left">
    <a class="logo-mini" href="{{ url_for('index') }}">身美</a>
    <a class="link back" href="{{ url_for('index') }}">← 返回录音库</a>
  </div>
  <div class="topbar-right">
    <span class="user-chip">👤 {{ username }}</span>
    <a class="link" href="{{ url_for('logout') }}">退出</a>
  </div>
</header>

<main class="container detail-page" data-rid="{{ rec.id }}">
  <section class="card">
    <div class="rec-meta">
      <div>
        <div class="meta-label">顾问</div>
        <div class="meta-value" id="meta-advisor">—</div>
      </div>
      <div>
        <div class="meta-label">顾客</div>
        <div class="meta-value" id="meta-customer">—</div>
      </div>
      <div>
        <div class="meta-label">录音时间</div>
        <div class="meta-value" id="meta-time">—</div>
      </div>
      <div>
        <div class="meta-label">时长</div>
        <div class="meta-value" id="meta-duration">—</div>
      </div>
      <div>
        <div class="meta-label">文件</div>
        <div class="meta-value meta-mono" id="meta-key">—</div>
      </div>
    </div>

    <div class="player-wrap">
      <audio id="audio" controls preload="metadata"></audio>
      <div class="player-tips">
        <span>键盘：空格 播放/暂停　←/→ 后退/前进 5 秒</span>
        <span id="player-speed">
          倍速：
          <button data-speed="0.75" class="speed-btn">0.75×</button>
          <button data-speed="1" class="speed-btn active">1×</button>
          <button data-speed="1.25" class="speed-btn">1.25×</button>
          <button data-speed="1.5" class="speed-btn">1.5×</button>
          <button data-speed="2" class="speed-btn">2×</button>
        </span>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <h3>① ASR 语音转录（含说话人分离）</h3>
      <div class="head-actions">
        <span id="asr-status-chip" class="chip">未开始</span>
        <button id="btn-asr" class="btn-primary">开始转录</button>
      </div>
    </div>
    <div id="asr-content" class="transcript">尚未转录。</div>
  </section>

  <section class="card">
    <div class="card-head">
      <h3>② 知识库 AI 复盘点评</h3>
      <div class="head-actions">
        <span id="ana-status-chip" class="chip">未开始</span>
        <button id="btn-analyze" class="btn-primary">开始分析</button>
      </div>
    </div>
    <div id="ana-content" class="analysis">尚未生成。需要先完成 ASR 转录。</div>
  </section>

  <section class="card">
    <div class="card-head">
      <h3>③ 老板点评（人工标注）</h3>
      <div class="head-actions">
        <span id="eval-chip" class="chip">未填写</span>
      </div>
    </div>
    <form id="eval-form" class="eval-form">
      <label class="block">
        <span class="lbl">错的点</span>
        <textarea name="wrong_points" rows="4" placeholder="哪里说错了、做错了？例如：顾客提到照顾老人，顾问没有共情，直接转项目。"></textarea>
      </label>
      <label class="block">
        <span class="lbl">改进建议</span>
        <textarea name="improvement" rows="4" placeholder="顾问应该怎么调整？例如：先接住情绪 1-2 句，再过渡到项目。"></textarea>
      </label>
      <label class="block">
        <span class="lbl">正确做法</span>
        <textarea name="correct_practice" rows="4" placeholder="标准做法 / 你期望看到的话术示范。"></textarea>
      </label>
      <div class="actions">
        <button type="submit" class="btn-primary">提交点评</button>
        <span id="eval-msg" class="form-msg"></span>
      </div>
    </form>
  </section>
</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
<script>initDetailPage();</script>
{% endblock %}
