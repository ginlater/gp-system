<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 工牌接诊分析系统</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#f4f6f9;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.box{background:#fff;border:1px solid #d5dce8;border-radius:6px;padding:36px 40px;width:100%;max-width:360px;box-shadow:0 4px 20px rgba(0,0,0,.04)}
@media (max-width:480px){.box{padding:28px 22px}input,button{font-size:16px !important}}
h1{font-size:18px;color:#1c3461;margin-bottom:6px}
.sub{font-size:12px;color:#8a95a3;margin-bottom:24px}
label{display:block;font-size:12px;color:#4a5568;margin:14px 0 6px}
input{width:100%;border:1px solid #d5dce8;border-radius:4px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none}
input:focus{border-color:#4a90d9}
button{width:100%;margin-top:22px;background:#1c3461;color:#fff;border:none;border-radius:4px;padding:10px;font-size:14px;font-family:inherit;cursor:pointer}
button:hover{background:#2d5594}
.err{margin-top:12px;font-size:12px;color:#e74c3c}
</style>
</head>
<body>
<form class="box" method="post">
  <h1>工牌接诊分析系统</h1>
  <div class="sub">请登录</div>
  <label>用户名</label>
  <input name="username" required autofocus>
  <label>密码</label>
  <input name="password" type="password" required>
  <button type="submit">登录</button>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
</form>
</body>
</html>
