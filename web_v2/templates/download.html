<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下载 刁姐陪伴 App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#f4f6f9;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.box{background:#fff;border:1px solid #d5dce8;border-radius:8px;padding:36px 32px;width:100%;max-width:380px;box-shadow:0 4px 20px rgba(0,0,0,.04);text-align:center}
@media (max-width:480px){.box{padding:28px 22px}.btn{font-size:17px}}
.logo{width:72px;height:72px;border-radius:18px;background:#1c3461;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:600;margin:0 auto 16px}
h1{font-size:20px;color:#1c3461;margin-bottom:4px}
.meta{font-size:12px;color:#8a95a3;margin-bottom:24px}
.btn{display:block;width:100%;background:#1c3461;color:#fff;border:none;border-radius:6px;padding:14px;font-size:16px;font-weight:600;text-decoration:none;cursor:pointer}
.btn:hover{background:#2d5594}
.btn.disabled{background:#c5ccd6;pointer-events:none}
.tips{margin-top:24px;text-align:left;font-size:12px;color:#5a6678;line-height:1.7;border-top:1px solid #eef1f5;padding-top:18px}
.tips b{color:#1c3461}
.tips ol{margin:6px 0 0 18px}
.note{margin-top:16px;font-size:11px;color:#aab2bf}
</style>
</head>
<body>
<div class="box">
  <div class="logo">刁</div>
  <h1>刁姐陪伴</h1>
  <div class="meta">
    安卓 App 安装包{% if size_mb %} · {{ size_mb }} MB{% endif %}{% if updated %} · 更新于 {{ updated }}{% endif %}
  </div>
  {% if available %}
    <a class="btn" href="{{ url_for('download_apk') }}">下载安装包（.apk）</a>
  {% else %}
    <span class="btn disabled">安装包暂不可用</span>
  {% endif %}
  <div class="tips">
    <b>安装步骤：</b>
    <ol>
      <li>用手机浏览器打开本页，点上方按钮下载</li>
      <li>下载完成后点开 apk 文件</li>
      <li>若提示「未知来源 / 未知应用」，按提示允许后即可安装</li>
    </ol>
  </div>
  <div class="note">仅支持安卓（Android）手机 · iPhone 暂不支持</div>
</div>
</body>
</html>
