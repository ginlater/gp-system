<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>顾客档案 · 工牌接诊分析系统</title>
<style>
  :root{--navy:#1c3461;--blue:#4a90d9;--border:#e3e8f0;--bg-light:#f8f9fc;--text-mid:#445;--text-mute:#8a93a6}
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f4f6fa;color:#222}
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  a.back{color:var(--blue);text-decoration:none;font-size:13px}
  .card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:16px}
  .card h3{font-size:15px;color:var(--navy);margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .info-grid{display:flex;flex-wrap:wrap;gap:18px;font-size:14px}
  .info-grid b{color:var(--navy)}
  .chip{border-radius:99px;padding:4px 12px;font-size:13px;display:inline-block}
  .chip-hist{background:rgba(28,52,97,.1);color:var(--navy);border:1px solid rgba(28,52,97,.2)}
  .chip-cur{background:rgba(74,144,217,.16);color:var(--blue);border:1px solid rgba(74,144,217,.4)}
  .tl-item{border-left:2px solid var(--border);padding:0 0 18px 16px;position:relative;margin-left:6px}
  .tl-item::before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--blue)}
  .tl-date{font-weight:700;color:var(--navy);font-size:14px}
  .tl-meta{font-size:12px;color:var(--text-mute);margin:2px 0 6px}
  .btn{background:var(--navy);color:#fff;border:none;border-radius:5px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit}
  .btn.sec{background:#fff;color:var(--navy);border:1px solid var(--border)}
  select{border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:12px;font-family:inherit}
  .muted{color:var(--text-mute);font-size:13px}
  .hit{background:#fff7e6;color:#b9770e;border:1px solid #f0c97a;border-radius:4px;padding:1px 7px;font-size:11px;margin-left:4px}
  a.sess-link{color:var(--blue);text-decoration:none;font-size:12px}
  /* 客户价值预测 · 高级卡片 */
  .vp-card{border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px;box-shadow:0 4px 16px rgba(28,52,97,.06);background:#fff}
  .vp-head{display:flex;align-items:center;gap:10px;padding:13px 18px;color:#fff;font-weight:700;font-size:15px;letter-spacing:.3px}
  .vp-ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.25);font-size:17px;flex:0 0 auto}
  .vp-body{padding:15px 20px 17px}
  .vp-body .md-h{font-size:14px;font-weight:700;color:var(--navy);margin:15px 0 7px;padding-left:10px;border-left:3px solid var(--acc)}
  .vp-body .md-h:first-child{margin-top:0}
  .vp-body .md-p{margin:7px 0;font-size:13.5px;line-height:1.85;color:#3a4252}
  .vp-body .md-ul,.vp-body .md-ol{margin:8px 0;padding:0;list-style:none}
  .vp-body .md-ol{counter-reset:mdi}
  .vp-body .md-ul li,.vp-body .md-ol li{position:relative;padding-left:24px;margin:7px 0;font-size:13.5px;line-height:1.8;color:#3a4252}
  .vp-body .md-ul li::before{content:"";position:absolute;left:7px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
  .vp-body .md-ol li{counter-increment:mdi}
  .vp-body .md-ol li::before{content:counter(mdi);position:absolute;left:0;top:1px;width:18px;height:18px;border-radius:50%;background:var(--acc);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .vp-body .md-b{font-weight:700;color:var(--navy);background:linear-gradient(transparent 62%, #ffe7a3 62%);padding:0 1px}
  .vp-body .md-stars{color:#f0a92b;letter-spacing:2px;font-size:15px;vertical-align:middle}
  .vp-body .md-sub{font-weight:700;color:var(--acc);margin:13px 0 5px;font-size:13.5px}
  .vp-body .md-ok{color:#22a36b;font-weight:700}
  .vp-body .md-no{color:#d9534f;font-weight:700}
  .vp-body .md-table-wrap{overflow-x:auto;margin:11px 0;border-radius:9px;border:1px solid var(--border)}
  .vp-body .md-table{border-collapse:collapse;width:100%;font-size:13px;min-width:420px}
  .vp-body .md-table th{background:var(--acc);color:#fff;padding:9px 11px;text-align:left;font-weight:600}
  .vp-body .md-table td{border-top:1px solid var(--border);padding:9px 11px;color:#3a4252;line-height:1.65;vertical-align:top}
  .vp-body .md-table td:not(:first-child){border-left:1px solid var(--border)}
  .vp-body .md-table tr:nth-child(even) td{background:#fafbfd}
  .vp-advisor{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--border)}
  .vp-advisor:last-child{border-bottom:none}
  .vp-av-badge{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#7b5ec7,#9b7fe0);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}
  .vp-av-name{font-weight:700;color:var(--navy);font-size:14px;margin-bottom:2px}
  .vp-loading{display:flex;align-items:center;gap:10px;color:var(--text-mid);font-size:13px;padding:18px;background:var(--bg-light);border-radius:10px}
  .vp-spin{width:18px;height:18px;border:2px solid #d6deec;border-top-color:var(--blue);border-radius:50%;animation:vpspin .8s linear infinite}
  @keyframes vpspin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="{{ request.script_root }}/admin">← 返回管理后台</a>
    <span class="muted">{{ username }}（{{ role }}）</span>
  </div>

  <div class="card">
    <h3 id="custName">加载中…</h3>
    <div class="info-grid" id="custInfo"></div>
  </div>

  <div class="card">
    <h3>累积标签 · 画像积累
      <select id="cpRange" onchange="loadProfile()">
        <option value="all">至今</option>
        <option value="30">近30天</option>
        <option value="90">近90天</option>
        <option value="180">近180天</option>
        <option value="365">近1年</option>
      </select>
    </h3>
    <div id="accTags" style="display:flex;flex-wrap:wrap;gap:8px"><span class="muted">加载中…</span></div>
  </div>

  <div class="card">
    <h3>🔮 客户价值预测 <span style="font-size:12px;font-weight:normal;color:var(--text-mute)" id="valMeta"></span></h3>
    <div class="muted" style="margin-bottom:10px">AI 基于该客人历次接待综合产出（结果会缓存，有新接诊分析后可点刷新重算）。</div>
    <div id="valActions" style="display:flex;align-items:center;flex-wrap:wrap;gap:8px">
      <button class="btn" onclick="genValue()" id="genBtn">✨ 生成 / 刷新预测</button>
      <select id="valModel" title="选择生成所用模型"><option>加载模型…</option></select>
      <span class="muted" id="valGateHint" style="display:none">仅管理员/店长可生成</span>
    </div>
    <div id="valContent" style="margin-top:14px"></div>
  </div>

  <div class="card">
    <h3>服务时间线 <span class="muted" id="sessCount"></span></h3>
    <div id="timeline"><span class="muted">加载中…</span></div>
  </div>
</div>

<script>
const BASE = {{ request.script_root|tojson }};
const CUSTOMER_ID = {{ customer_id }};
const ROLE = {{ (role or '')|tojson }};
// POST /api/admin/customer_value 后端仍限管理员/店长（顾问只读档案，不能触发烧钱的 LLM 生成）
const CAN_GENERATE = ['admin','super','store_manager'].includes(ROLE);
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// 价值预测模型选择器：拉 /api/models，按 tier_label 显示三档；未配置的置灰标注；默认选专家版
function loadModels() {
  const sel = document.getElementById('valModel');
  if (!sel) return;
  // 顾问无生成权限：隐藏选择器，显示提示，禁用按钮
  if (!CAN_GENERATE) {
    sel.style.display = 'none';
    const gate = document.getElementById('valGateHint'); if (gate) gate.style.display = '';
    const btn = document.getElementById('genBtn');
    if (btn) { btn.disabled = true; btn.style.opacity = '0.5'; btn.style.cursor = 'not-allowed'; btn.title = '仅管理员/店长可生成'; }
    return;
  }
  fetch(`${BASE}/api/models`)
    .then(r => r.json()).then(d => {
      const models = d.models || [];
      const def = d.default || 'deepseek-v4-pro';
      if (!models.length) { sel.innerHTML = '<option value="">默认模型</option>'; return; }
      sel.innerHTML = models.map(m => {
        // 三档优先显示 tier_label（极速版/进阶版/专家版），无则回退 name/label/id
        const lbl = m.tier_label || m.name || m.label || m.id;
        const txt = m.disabled ? `${lbl}（未配置）` : lbl;
        return `<option value="${esc(m.id)}"${m.disabled?' disabled':''}>${esc(txt)}</option>`;
      }).join('');
      // 默认选中：优先后端 default（现成可用的专家版 deepseek-v4-pro），且必须未禁用
      const defM = models.find(m => m.id === def && !m.disabled);
      const firstOk = models.find(m => !m.disabled);
      const pick = defM || firstOk;
      if (pick) sel.value = pick.id;
    })
    .catch(() => { sel.innerHTML = '<option value="">默认模型</option>'; });
}

function loadProfile() {
  const rng = document.getElementById('cpRange').value;
  fetch(`${BASE}/api/admin/customer_profile?customer_id=${CUSTOMER_ID}&range=${rng}`)
    .then(r => r.json()).then(d => {
      if (d.error) { document.getElementById('custName').textContent = d.error; return; }
      const info = d.info || {};
      document.getElementById('custName').textContent = info.name || '（未命名）';
      document.getElementById('custInfo').innerHTML =
        `<div>会员号：<b>${esc(info.member_card)||'—'}</b></div>` +
        `<div>手机尾号：<b>${esc(info.phone_tail)||'—'}</b></div>` +
        `<div>接诊次数：<b>${d.session_count}</b></div>`;
      // 累积标签
      const at = d.accumulated_tags || [];
      document.getElementById('accTags').innerHTML = at.length
        ? at.map(t => `<span class="chip chip-hist">${esc(t.tag)}${t.count>1?` ×${t.count}`:''}</span>`).join('')
        : '<span class="muted">该区间暂无标签</span>';
      // 时间线
      const sess = d.sessions || [];
      document.getElementById('sessCount').textContent = `（共 ${sess.length} 次）`;
      document.getElementById('timeline').innerHTML = sess.length ? sess.map(s => `
        <div class="tl-item">
          <div class="tl-date">${esc(s.service_date)||'?'} <a class="sess-link" href="${BASE}/session/${s.id}">查看报告 →</a></div>
          <div class="tl-meta">顾问：${esc(s.advisor)||'?'}${s.store_name?(' · '+esc(s.store_name)):''} · ${esc(s.analysis_status)||''}</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${(s.tags||[]).map(t=>`<span class="chip chip-cur">${esc(t)}</span>`).join('') || '<span class="muted">无标签</span>'}
            ${(s.project_hits||[]).map(p=>`<span class="hit">命中主推：${esc(p)}</span>`).join('')}
          </div>
        </div>`).join('') : '<span class="muted">暂无接诊记录</span>';
    });
}

// markdown-lite → 漂亮 HTML（标题/表格/要点/编号/加粗/星级/勾叉）
function mdLite(raw) {
  if (!raw) return '';
  const lines = esc(raw).split(/\r?\n/);
  const out = []; let list = null; let tbl = null; let tblHeader = false;
  const inline = s => s
    .replace(/\*\*(.+?)\*\*/g, '<strong class="md-b">$1</strong>')
    .replace(/([★☆]{1,5})/g, '<span class="md-stars">$1</span>')
    .replace(/✓/g, '<span class="md-ok">✓</span>')
    .replace(/[✗✘×]/g, '<span class="md-no">✗</span>');
  const flushList = () => { if (list) { out.push(`<${list.t} class="md-${list.t}">` + list.items.map(i=>`<li>${i}</li>`).join('') + `</${list.t}>`); list = null; } };
  const flushTbl = () => {
    if (!tbl) return;
    let head = '';
    let body = tbl;
    if (tblHeader && tbl.length) { head = '<thead><tr>' + tbl[0].map(c=>`<th>${c}</th>`).join('') + '</tr></thead>'; body = tbl.slice(1); }
    out.push(`<div class="md-table-wrap"><table class="md-table">${head}<tbody>` +
      body.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('') + '</tbody></table></div>');
    tbl = null; tblHeader = false;
  };
  const flushAll = () => { flushList(); flushTbl(); };
  const cellsOf = t => t.replace(/^\s*\||\|\s*$/g, '').split('|').map(c=>c.trim());
  const isSep = arr => arr.length > 0 && arr.every(c => /^:?-{2,}:?$/.test(c.replace(/\s/g,'')) || /^-+$/.test(c));
  for (const ln of lines) {
    const t = ln.trim();
    if (!t) { flushAll(); continue; }
    // 表格行：以 | 开头且含另一个 |
    if (/^\|.*\|/.test(t)) {
      flushList();
      const arr = cellsOf(t);
      if (isSep(arr)) { if (tbl && tbl.length === 1) tblHeader = true; continue; }
      (tbl = tbl || []).push(arr.map(inline));
      continue;
    }
    flushTbl();
    let m;
    if (m = t.match(/^#{1,6}\s*(.+)$/)) { flushList(); out.push(`<div class="md-h">${inline(m[1])}</div>`); continue; }
    if (m = t.match(/^[▶▷►]\s*(.+)$/)) { flushList(); out.push(`<div class="md-sub">${inline(m[1])}</div>`); continue; }
    if (m = t.match(/^[-*•·]\s+(.+)$/)) { if (!list || list.t !== 'ul') { flushList(); list = {t:'ul', items:[]}; } list.items.push(inline(m[1])); continue; }
    if (m = t.match(/^\d+[.、)]\s*(.+)$/)) { if (!list || list.t !== 'ol') { flushList(); list = {t:'ol', items:[]}; } list.items.push(inline(m[1])); continue; }
    flushList(); out.push(`<p class="md-p">${inline(t)}</p>`);
  }
  flushAll();
  return out.join('');
}
const VP_DIMS = [
  {key:'value_rebuild', title:'客户价值评估',                   icon:'💎', color:'#b8860b'},
  {key:'battle_plan',   title:'攻坚作战方案',                   icon:'🎯', color:'#d9534f'},
  {key:'project_plan',  title:'项目规划（竞品/可做项目/售后学习）', icon:'📋', color:'#4a90d9'},
  {key:'biz_plan',      title:'经营规划（下一步/回店）',          icon:'📈', color:'#2e9e6b'},
];
function vpCard(title, icon, color, bodyHtml) {
  return `<div class="vp-card" style="--acc:${color}">
    <div class="vp-head" style="background:linear-gradient(135deg,${color},${color}cc)"><span class="vp-ico">${icon}</span>${title}</div>
    <div class="vp-body">${bodyHtml}</div></div>`;
}
function renderValue(content, meta) {
  const m = document.getElementById('valMeta');
  if (m) m.textContent = meta || '';
  const wrap = document.getElementById('valContent');
  if (!content) { wrap.innerHTML = ''; return; }
  let html = VP_DIMS.filter(d => content[d.key]).map(d => vpCard(d.title, d.icon, d.color, mdLite(content[d.key]))).join('');
  const am = content.advisor_match || [];
  if (am.length) {
    const body = am.map(a => `<div class="vp-advisor">
        <div class="vp-av-badge">${esc((a.advisor||'?').slice(0,1))}</div>
        <div style="flex:1"><div class="vp-av-name">${esc(a.advisor)}</div><div>${mdLite(a.assessment)}</div></div>
      </div>`).join('');
    html += vpCard('顾问匹配度', '🤝', '#7b5ec7', body);
  }
  wrap.innerHTML = html || '<span class="muted">（无内容）</span>';
}

function loadValue() {
  fetch(`${BASE}/api/admin/customer_value?customer_id=${CUSTOMER_ID}`)
    .then(r => r.json()).then(d => {
      if (d.error) return;
      if (d.has_cache) {
        let meta = `生成于 ${d.generated_at||''}${d.model?(' · '+d.model):''}`;
        if (d.stale) meta += '（有新接诊，建议刷新）';
        renderValue(d.content, meta);
      } else {
        document.getElementById('valContent').innerHTML =
          `<span class="muted">${d.done_count? '尚未生成，点上方按钮生成。' : '该客人还没有已完成的接诊分析。'}</span>`;
      }
    });
}

function genValue() {
  if (!CAN_GENERATE) {
    document.getElementById('valContent').innerHTML = '<span class="muted">仅管理员/店长可生成价值预测。</span>';
    return;
  }
  const btn = document.getElementById('genBtn');
  btn.disabled = true; btn.textContent = '⏳ AI 生成中…';
  document.getElementById('valContent').innerHTML =
    '<div class="vp-loading"><div class="vp-spin"></div>AI 正在综合该客人全部历史接待生成深度分析，首次约需 1–2 分钟，请耐心等待…</div>';
  const sel = document.getElementById('valModel');
  const model = (sel && sel.value) ? sel.value : '';
  const payload = {customer_id: CUSTOMER_ID};
  if (model) payload.model = model;
  fetch(`${BASE}/api/admin/customer_value`, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify(payload),
  }).then(r => r.json().catch(() => ({})).then(d => ({status: r.status, d})))
    .then(({status, d}) => {
      btn.disabled = false; btn.textContent = '✨ 生成 / 刷新预测';
      // 后端 POST 仍限管理员/店长：顾问越权点击时优雅提示而非崩溃
      if (status === 403) {
        document.getElementById('valContent').innerHTML =
          `<span class="muted">${esc((d && d.error) || '仅管理员/店长可生成价值预测。')}</span>`;
        return;
      }
      if (!d || d.error) { document.getElementById('valContent').innerHTML = `<span class="muted">生成失败：${esc((d && d.error) || ('HTTP '+status))}</span>`; return; }
      renderValue(d.content, `生成于 ${d.generated_at||''}${d.model?(' · '+d.model):''}`);
    }).catch(e => { btn.disabled = false; btn.textContent = '✨ 生成 / 刷新预测'; document.getElementById('valContent').innerHTML = '<span class="muted">生成失败，请重试</span>'; });
}

loadProfile();
loadModels();
loadValue();
</script>
</body>
</html>
