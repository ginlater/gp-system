name: MeiliCompanion

options:
  bundleIdPrefix: com.aibeautyfulwomen.gongpai
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: zh-Hans
    CLANG_ENABLE_MODULES: YES

targets:
  MeiliCompanion:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    dependencies:
      - sdk: CoreBluetooth.framework
      - sdk: AVFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aibeautyfulwomen.gongpai.ios
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: MeiliCompanion.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # ── 声云陪伴笔 libPNote.a:仅真机(iphoneos)链接 + 引桥接头;模拟器完全不碰(arm64-only,链不过) ──
        "SWIFT_OBJC_BRIDGING_HEADER[sdk=iphoneos*]": Vendor/Bridging-Header.h
        "HEADER_SEARCH_PATHS[sdk=iphoneos*]": $(inherited) $(PROJECT_DIR)/Vendor/sonilib
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(inherited) $(PROJECT_DIR)/Vendor/sonilib
        "OTHER_LDFLAGS[sdk=iphoneos*]": $(inherited) -ObjC -lPNote

schemes:
  MeiliCompanion:
    build:
      targets:
        MeiliCompanion: all
    run:
      config: Debug
    archive:
      config: Release
