<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 接诊分析系统</title>
  <link rel="stylesheet" href="/web/common.css">
  <link rel="stylesheet" href="/web/login.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h1>接诊分析系统</h1>
      <p class="subtitle">请登录您的账号</p>
      <div class="login-error" id="errorMsg"></div>
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <input type="text" class="form-input" id="username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" class="form-input" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">登录</button>
      </form>
    </div>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('show');
      submitBtn.disabled = true;
      submitBtn.textContent = '登录中...';
      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await resp.json();
        if (data.ok) {
          window.location.href = data.redirect;
        } else {
          errorEl.textContent = data.error || '登录失败';
          errorEl.classList.add('show');
        }
      } catch (err) {
        errorEl.textContent = '网络错误，请重试';
        errorEl.classList.add('show');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '登录';
      }
    });
  </script>
</body>
</html>
