<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 - 接诊分析系统</title>
  <link rel="stylesheet" href="/web/common.css">
  <link rel="stylesheet" href="/web/admin.css">
</head>
<body>
  <header class="app-header">
    <h1>用户管理</h1>
    <div class="user-info">
      <a href="/" style="font-size:13px;color:var(--primary);text-decoration:none;">返回主页</a>
      <button class="btn btn-sm btn-outline" id="logoutBtn">退出</button>
    </div>
  </header>

  <div class="container admin-content">
    <div class="card">
      <div class="admin-toolbar">
        <h2>账号列表</h2>
        <button class="btn btn-primary btn-sm" id="addUserBtn">+ 新建用户</button>
      </div>
      <table class="table user-table">
        <thead><tr><th>用户名</th><th>显示名</th><th>角色</th><th>门店</th><th>操作</th></tr></thead>
        <tbody id="usersTbody"></tbody>
      </table>
    </div>
  </div>

  <!-- Create/Edit Modal -->
  <div class="modal-overlay" id="userModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">新建用户</span>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <form id="userForm">
        <input type="hidden" id="editUsername">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <input type="text" class="form-input" id="formUsername" required>
        </div>
        <div class="form-group">
          <label class="form-label">密码<span id="pwdHint" style="font-weight:normal;color:var(--gray-400);"></span></label>
          <input type="password" class="form-input" id="formPassword">
        </div>
        <div class="form-group">
          <label class="form-label">显示名称</label>
          <input type="text" class="form-input" id="formDisplayName" required>
        </div>
        <div class="form-group">
          <label class="form-label">角色</label>
          <select class="form-select" id="formRole">
            <option value="user">顾问 (user)</option>
            <option value="admin">管理员 (admin)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">门店</label>
          <input type="text" class="form-input" id="formStore" placeholder="可选">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;" id="formSubmitBtn">创建</button>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/web/admin.js"></script>
</body>
</html>
