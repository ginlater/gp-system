
plugins {
    id 'com.android.application'
}

// release 签名：从 android_app/keystore.properties 读取（keystore 与该文件都在 android_app/ 下）。
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) { keystoreProps.load(new FileInputStream(keystorePropsFile)) }

android {
    namespace 'com.airec.bledemo'
    compileSdk 34

    defaultConfig {
        // 应用身份用工牌系统的包名（与线上域名一致）；源码包名仍沿用 com.airec.bledemo 以最大化复用 Demo，二者互不影响。
        applicationId "com.aibeautyfulwomen.gongpai"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "2.0.0"

        ndk {
            // 只保留 armeabi-v7a：droidkit:opus 只提供了 v7a 的 libopus.so（无 arm64）。
            // 若同时打 arm64，64 位设备会优先选 arm64 → 找不到 libopus.so → 录音笔解码失败。
            // 统一跑 32 位，libopus.so 与 libjnidispatch.so 的 v7a 版都齐全。
            abiFilters "armeabi-v7a"
        }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        // libopus.so 必须解压到磁盘(extractNativeLibs=true)，JNA 才能用绝对路径 dlopen。
        // 否则 .so 压在 APK 里(AGP8 默认)，OpusBridge 加载失败 → 录音笔解码报"未知格式"。
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // Opus 解码已改用 JNA 直接调用 droidkit libopus.so，无需 CMake/JNI 编译
    // 如需恢复 JNI 方式，取消注释以下配置：
    // externalNativeBuild {
    //     cmake {
    //         path file("src/main/cpp/CMakeLists.txt")
    //     }
    // }
    // ndkVersion "25.1.8937393"
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.annotation:annotation:1.7.1'
    // ExoPlayer（标准格式播放）
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    // droidkit Opus：提供 native libopus.so
    implementation 'com.droidkit:opus:1.1.1'
    // JNA：纯 Java 调用 native libopus.so（无需 CMake/JNI 编译）
    // 必须用 @aar（Android 版）：它带各 ABI 的 libjnidispatch.so；
    // 桌面版 jar 的 libjnidispatch 从 classpath 找，Android 上 UnsatisfiedLinkError → JNA 整个不可用。
    implementation 'net.java.dev.jna:jna:5.14.0@aar'
}
