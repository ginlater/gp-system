
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// release 签名：从 android_app/keystore.properties 读取（keystore 与该文件都在 android_app/ 下）。
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) { keystoreProps.load(new FileInputStream(keystorePropsFile)) }

android {
    namespace 'com.airec.bledemo'
    compileSdk 34

    defaultConfig {
        // 应用身份用工牌系统的包名（与线上域名一致）；源码包名仍沿用 com.airec.bledemo 以最大化复用 Demo，二者互不影响。
        applicationId "com.aibeautyfulwomen.gongpai"
        minSdk 24
        targetSdk 34
        versionCode 23
        versionName "2.0.22"

        ndk {
            // 只保留 armeabi-v7a：droidkit:opus 只提供了 v7a 的 libopus.so（无 arm64）。
            // 若同时打 arm64，64 位设备会优先选 arm64 → 找不到 libopus.so → 录音笔解码失败。
            // 统一跑 32 位，libopus.so 与 libjnidispatch.so 的 v7a 版都齐全。
            abiFilters "armeabi-v7a"
        }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // v2 正式包独立身份 com.aibeautyfulwomen.gongpai.v2：与 v1(.gongpai) 同机并存，
            // 走独立下载链路(/download/v2)，不抢 v1 的强更/版本接口。
            applicationIdSuffix ".v2"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
        }
        debug {
            // 开发包同样 .v2（与 release 同 applicationId，单机二选一）；都与 v1 .gongpai 并存、不撞签名。
            applicationIdSuffix ".v2"
            versionNameSuffix "-v2dev"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        compose true
    }

    packaging {
        // libopus.so 必须解压到磁盘(extractNativeLibs=true)，JNA 才能用绝对路径 dlopen。
        // 否则 .so 压在 APK 里(AGP8 默认)，OpusBridge 加载失败 → 录音笔解码报"未知格式"。
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // Opus 解码已改用 JNA 直接调用 droidkit libopus.so，无需 CMake/JNI 编译
    // 如需恢复 JNI 方式，取消注释以下配置：
    // externalNativeBuild {
    //     cmake {
    //         path file("src/main/cpp/CMakeLists.txt")
    //     }
    // }
    // ndkVersion "25.1.8937393"
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.annotation:annotation:1.7.1'
    // ExoPlayer（标准格式播放）
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    // droidkit Opus：提供 native libopus.so
    implementation 'com.droidkit:opus:1.1.1'
    // JNA：纯 Java 调用 native libopus.so（无需 CMake/JNI 编译）
    // 必须用 @aar（Android 版）：它带各 ABI 的 libjnidispatch.so；
    // 桌面版 jar 的 libjnidispatch 从 classpath 找，Android 上 UnsatisfiedLinkError → JNA 整个不可用。
    implementation 'net.java.dev.jna:jna:5.14.0@aar'

    // ============ 声云录音卡片 PNote SDK 依赖（pnote_*.aar 内部引用，缺会运行时 NoClassDefFound） ============
    implementation 'com.polidea.rxandroidble2:rxandroidble:1.17.2'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.8'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.8'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'com.koushikdutta.async:androidasync:3.1.0'
    implementation 'org.xutils:xutils:3.3.40'
    implementation 'com.google.code.gson:gson:2.10.1'

    // ============ v2 原生 UI 新增依赖 ============
    // ---- Jetpack Compose (Material 3) ----
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    // ---- 网络层：对接现成后端 /api/consultant/* (Cookie 会话) ----
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.11.0'
    implementation 'com.squareup.moshi:moshi:1.15.1'
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.1'
    // ---- 图片加载（报告/头像）----
    implementation 'io.coil-kt:coil-compose:2.7.0'
    // ---- Kotlin 协程 ----
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    // ---- WorkManager：后台周期轮询提醒 → 本地通知 ----
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
}
